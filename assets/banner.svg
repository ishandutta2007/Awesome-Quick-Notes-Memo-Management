<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#accentGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: url(#subGrad);
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    .card-border {
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 1;
      fill: url(#cardGrad);
    }

    /* Subtle background animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -40; }
    }

    .pulse-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulse-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: 1000px 260px;
    }
    .animated-card-1 {
      animation: floatCard1 5s ease-in-out infinite;
    }
    .animated-card-2 {
      animation: floatCard2 6s ease-in-out infinite;
    }
    .grid-line {
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 1;
    }
    .flow-line {
      stroke: url(#accentGrad);
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: dashCycle 3s linear infinite;
      opacity: 0.4;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Subtle Decorative Grid Lines -->
  <line x1="0" y1="90" x2="1200" y2="90" class="grid-line" />
  <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
  <line x1="0" y1="270" x2="1200" y2="270" class="grid-line" />
  <line x1="300" y1="0" x2="300" y2="360" class="grid-line" />
  <line x1="600" y1="0" x2="600" y2="360" class="grid-line" />
  <line x1="900" y1="0" x2="900" y2="360" class="grid-line" />

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle cx="180" cy="90" r="130" fill="#38bdf8" filter="url(#glow)" opacity="0.3" class="pulse-orb-1" />
  <circle cx="1020" cy="270" r="140" fill="#818cf8" filter="url(#glow)" opacity="0.3" class="pulse-orb-2" />
  <circle cx="960" cy="70" r="100" fill="#c084fc" filter="url(#glow)" opacity="0.25" class="pulse-orb-1" />

  <!-- Animated Dynamic Connecting Data Flow -->
  <path d="M 80,310 Q 350,290 600,320 T 1120,300" fill="none" class="flow-line" />

  <!-- Floating Background Decorative Card 1 (Left) -->
  <g class="animated-card-1">
    <rect x="70" y="45" width="130" height="70" rx="10" class="card-border" />
    <rect x="85" y="60" width="40" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
    <rect x="85" y="75" width="80" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="85" y="87" width="60" height="6" rx="3" fill="#ffffff" opacity="0.25" />
  </g>

  <!-- Floating Background Decorative Card 2 (Right) -->
  <g class="animated-card-2">
    <rect x="1000" y="195" width="130" height="70" rx="10" class="card-border" />
    <rect x="1015" y="210" width="50" height="8" rx="4" fill="#c084fc" opacity="0.8" />
    <rect x="1015" y="225" width="80" height="6" rx="3" fill="#ffffff" opacity="0.25" />
    <rect x="1015" y="237" width="55" height="6" rx="3" fill="#ffffff" opacity="0.25" />
  </g>

  <!-- Foreground Main Branding & Text (Always in Foreground) -->
  <g id="foreground-content">
    <!-- Icon/Badge Anchor -->
    <g transform="translate(600, 75)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="2" />
      <!-- Memo Icon -->
      <path d="M -10,-12 L 6,-12 L 12,-6 L 12,12 L -10,12 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 6,-12 L 6,-6 L 12,-6" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="-5" y1="-2" x2="7" y2="-2" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
      <line x1="-5" y1="3" x2="7" y2="3" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
      <line x1="-5" y1="8" x2="3" y2="8" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" class="title">
      Awesome Quick Notes &amp; Memo Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="205" text-anchor="middle" class="subtitle">
      Curated Open-Source &amp; SaaS Solutions for Instant Capture, Fleeting Memos &amp; PKM
    </text>

    <!-- Feature Pills / Badges (Centered) -->
    <g transform="translate(600, 255)">
      <!-- Pill 1: Self-Hosted -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="0" width="135" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <text x="67" y="22" text-anchor="middle" class="badge-text">⚡ Self-Hosted</text>
      </g>
      <!-- Pill 2: Privacy & E2EE -->
      <g transform="translate(-165, 0)">
        <rect x="0" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
        <text x="72" y="22" text-anchor="middle" class="badge-text">🔒 Privacy &amp; E2EE</text>
      </g>
      <!-- Pill 3: Markdown First -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" opacity="0.9" />
        <text x="75" y="22" text-anchor="middle" class="badge-text">📝 Markdown-First</text>
      </g>
      <!-- Pill 4: Local-First Sync -->
      <g transform="translate(170, 0)">
        <rect x="0" y="0" width="150" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
        <text x="75" y="22" text-anchor="middle" class="badge-text">🔄 Local-First Sync</text>
      </g>
    </g>
  </g>
</svg>
